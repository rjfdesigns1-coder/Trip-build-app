

<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1">


<title>

Earth Tour Builder

</title>

<link rel="manifest" href="./manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>



* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html {
    scroll-behavior:smooth;
}


@keyframes fadeSlideIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
}


body {

    font-family:
    'Nunito Sans', Arial, Helvetica, sans-serif;

    background:
    #F2E8D0;

    color:
    #2B2420;

}


h1, h2, h3, .day-card-header h3 {

    font-family:'Abril Fatface', Georgia, serif;

    font-weight:normal;

}


/* HEADER - sunburst signature */

header {

    position:relative;

    overflow:hidden;

    background:
    #0E4D46;

    color:
    #FFFCF3;

    padding:
    50px 20px 34px;

    text-align:center;

}


header::before {

    content:"";

    position:absolute;

    top:50%;
    left:50%;

    width:1000px;
    height:1000px;

    transform:translate(-50%,-50%);

    background:repeating-conic-gradient(
        #E3A73E26 0deg 8deg,
        transparent 8deg 16deg
    );

    z-index:0;

}


header .header-inner {

    position:relative;
    z-index:1;

}


header h1 {

    font-size:46px;

    line-height:1.15;

    margin-bottom:14px;

    text-shadow:0 2px 0 rgba(0,0,0,.15);

}


header p {

    display:inline-block;

    font-family:'Nunito Sans', Arial, sans-serif;

    font-weight:800;

    letter-spacing:.04em;

    text-transform:uppercase;

    font-size:14px;

    background:rgba(255,255,255,.14);

    border:1px solid rgba(255,255,255,.35);

    border-radius:999px;

    padding:8px 20px;

}


/* SHORE DIVIDER - scalloped edge between header and content */

.shore-divider {

    height:22px;

    background-image:radial-gradient(
        circle at 11px 0,
        transparent 11px,
        #0E4D46 11.5px
    );

    background-size:22px 22px;

    background-repeat:repeat-x;

    background-position:-11px 0;

}


.container {

    max-width:1000px;

    margin:auto;

    padding:20px;

}


.card {

    background:
    #FFFCF3;

    border-radius:14px;

    border-top:6px solid #E3A73E;

    overflow:hidden;

    box-shadow:
    0 12px 30px rgba(43,36,32,.14);

    animation:fadeSlideIn .35s ease;

}


.hero {

    width:100%;

    height:340px;

    object-fit:cover;

    display:block;

    background:#ddd;

}


.content {

    padding:30px;

}


/* CATEGORY BADGES */

.category {

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 16px;

    border-radius:999px;

    color:white;

    font-weight:800;

    font-size:14px;

    letter-spacing:.02em;

    margin-bottom:18px;

}


.category.beach {
    background:#2C7DA0;
}

.category.nature {
    background:#5C7A3D;
}

.category.castle {
    background:#6B3F5C;
}

.category.harbour {
    background:#143F52;
}

.category.historic {
    background:#B8862E;
}

.category.campsite {
    background:#3F6B4A;
}

.category.walk {
    background:#6B5A45;
}

.category.default {
    background:#BD4033;
}



/* TITLES */

h2 {

    font-size:34px;

    line-height:1.2;

    margin-bottom:10px;

}


h3 {

    font-size:26px;

    color:
    #0E4D46;

    margin-bottom:20px;

}



/* DESCRIPTION */

.description {

    font-size:18px;

    line-height:1.6;

    margin-bottom:20px;

}



/* QUICK FACTS */

.quick-facts {

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin:25px 0;

}


.fact {

    background:#FBF3DE;

    border:1px solid #E3D6B8;

    border-radius:999px;

    padding:9px 16px;

    font-weight:800;

    font-size:14px;

}



/* HIGHLIGHTS */

.highlights-box {

    background:#FBF3DE;

    border-radius:16px;

    padding:20px;

    margin:25px 0;

}


.highlights-box h4 {

    font-family:'Nunito Sans', Arial, sans-serif;

    color:
    #0E4D46;

    margin-bottom:12px;

}


.highlights-box li {

    margin:8px 0;

}



/* INFORMATION SECTIONS */

.section-title {

    font-size:20px;

    font-weight:800;

    color:
    #0E4D46;

    margin:

    28px 0 12px;

}


.info-grid {

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:14px;

}


.info-card {

    background:#FBF3DE;

    border-radius:14px;

    padding:15px;

    border:1px solid #E3D6B8;

}


.info-card strong {

    display:block;

    margin-bottom:8px;

}



/* BUTTONS */

.buttons {

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    margin-top:30px;

}


.button,
button {

    background:
    #BD4033;

    color:white;

    padding:14px 22px;

    border:none;

    border-radius:10px;

    text-decoration:none;

    cursor:pointer;

    font-family:'Nunito Sans', Arial, sans-serif;

    font-weight:800;

    font-size:16px;

    box-shadow:0 3px 0 rgba(43,36,32,.25);

    transition:filter .2s ease, transform .1s ease, opacity .2s ease, box-shadow .1s ease;

}


.button:hover,
button:hover {

    filter:brightness(.94);

}


.button:active,
button:active {

    transform:translateY(2px);

    box-shadow:0 1px 0 rgba(43,36,32,.25);

}


.button:disabled,
button:disabled {

    opacity:.4;

    cursor:not-allowed;

    filter:none;

    transform:none;

    box-shadow:none;

}


.button-secondary {

    background:#FFFCF3;
    color:#0E4D46;
    border:2px solid #0E4D46;
    box-shadow:none;

}


.button-secondary:hover {

    background:#F2E8D0;
    filter:none;

}


/* NEW TRIP MODAL */

.modal-overlay {

    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(43,36,32,.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;

}


.modal-box {

    background:#FFFCF3;
    border-radius:16px;
    border-top:6px solid #E3A73E;
    padding:28px;
    max-width:420px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.35);

}


.modal-box h3 {

    font-size:24px;
    color:#0E4D46;
    margin-bottom:10px;

}


.modal-status {

    font-size:14px;
    font-weight:700;
    color:#BD4033;
    min-height:20px;
    margin-top:8px;

}



/* PROGRESS */

.progress {

    text-align:center;

    margin-top:25px;

    font-weight:800;

    color:#6B5A45;

}



/* FOOTER */

footer {

    text-align:center;

    padding:30px;

    color:
    #6B5A45;

    font-weight:600;

}



/* MOBILE */

@media(max-width:700px){


header h1 {

    font-size:32px;

}


h2 {

    font-size:27px;

}


h3 {

    font-size:21px;

}


.hero {

    height:220px;

}


.buttons {

    flex-direction:column;

}


.button,
button {

    width:100%;

}


}

/* HOMEPAGE - DAY LIST */

.day-list {

    margin-top:24px;

}


.day-card {

    background:#FBF3DE;
    border:1px solid #E3D6B8;
    border-radius:16px;
    padding:18px 20px;
    margin-bottom:16px;
    transition:transform .2s ease, box-shadow .2s ease;
    animation:fadeSlideIn .4s ease backwards;

}


.day-card:hover {

    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(43,36,32,.1);

}


.day-card-header {

    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    margin-bottom:10px;
    gap:12px;

}


.day-card-header h3 {

    display:inline-block;
    font-size:18px;
    color:#0E4D46;
    background:#E3A73E33;
    border:2px dashed #0E4D46;
    border-radius:8px;
    padding:4px 14px;
    margin-bottom:0;
    white-space:nowrap;

}


.day-card-count {

    font-size:13px;
    color:#6B5A45;
    font-weight:800;
    text-align:right;

}


.stop-list {

    list-style:none;

}


.stop-list li.stop-link {

    padding:8px 0 8px 18px;
    border-left:3px solid #BD4033;
    margin-bottom:4px;
    cursor:pointer;
    font-size:15px;
    border-radius:0 8px 8px 0;
    transition:background .15s ease, padding-left .15s ease;

}


.stop-list li.stop-link:hover {

    background:#F2E8D0;
    padding-left:24px;

}


.camp-line {

    margin-top:10px;
    font-size:14px;
    font-weight:800;
    color:#0E4D46;

}


/* PROGRESS BAR (stop view) */

.progress-bar-track {

    height:6px;
    background:#E3D6B8;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;

}


.progress-bar-fill {

    height:100%;
    background:#BD4033;
    border-radius:999px;
    transition:width .35s ease;

}


/* SEARCH BOX (homepage) */

.search-box {

    width:100%;
    padding:14px 16px;
    font-size:16px;
    font-family:'Nunito Sans', Arial, sans-serif;
    border:1px solid #E3D6B8;
    border-radius:12px;
    margin:20px 0;
    background:#FBF3DE;

}


.search-box:focus {

    outline:2px solid #BD4033;
    background:#FFFCF3;

}


/* MAP (homepage) */

.map-container {

    height:320px;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:24px;
    border:1px solid #E3D6B8;

}


/* QR SHARE CARD (homepage) */

.qr-card {

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:#FBF3DE;
    border:1px solid #E3D6B8;
    border-radius:16px;
    padding:20px;
    margin-bottom:24px;
    text-align:center;

}


.qr-code-box {

    background:#FFFCF3;
    padding:10px;
    border-radius:12px;
    line-height:0;

}


.qr-caption {

    font-size:13px;
    color:#6B5A45;
    font-weight:700;

}


/* DISTANCE TO NEXT STOP (stop view) */

.next-leg {

    font-size:15px;
    font-weight:800;
    color:#6B5A45;
    margin-bottom:20px;

}


/* WEATHER WIDGET (stop view) */

.weather-card {

    border-left:4px solid #E3A73E;
    margin-bottom:20px;

}


/* NEARBY EATERIES WIDGET (stop view) */

.restaurants-card {

    border-left:4px solid #BD4033;
    margin-bottom:20px;

}


.eatery-row {

    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid #E3D6B8;
    font-weight:700;

}


.eatery-row:last-of-type {

    border-bottom:none;

}


.eatery-meta {

    font-size:13px;
    font-weight:600;
    color:#6B5A45;
    white-space:nowrap;

}


.widget-link {

    display:inline-block;
    margin-top:10px;
    font-size:14px;
    font-weight:800;
    color:#BD4033;
    text-decoration:none;

}


.widget-link:hover {

    text-decoration:underline;

}





</style>


</head>



<body>



<header>


<div class="header-inner">

<h1 id="page-title">

Earth Tour Builder

</h1>


<p id="summary">

</p>

</div>


</header>


<div class="shore-divider"></div>




<div class="container">


<div id="app">


</div>


</div>


<div id="new-trip-modal" class="modal-overlay">
<div class="modal-box">
<h3>✦ Start a New Trip</h3>
<p class="description">Type a place and we'll build a trip around it using free map data and Wikipedia - no travel data needed.</p>
<input type="text" id="new-trip-input" class="search-box" placeholder="e.g. Bath, York, Snowdonia..." onkeydown="if(event.key==='Enter') generateNewTrip();">
<p id="new-trip-status" class="modal-status"></p>
<div class="buttons">
<button id="new-trip-generate-btn" onclick="generateNewTrip()">Generate Trip</button>
<button class="button-secondary" onclick="closeNewTripModal()">Cancel</button>
</div>
</div>
</div>


<div id="account-modal" class="modal-overlay">
<div class="modal-box">
<h3>👤 Sign In / Sign Up</h3>
<p class="description">Create an account (or sign back in) so your trips follow you across devices.</p>
<input type="email" id="account-email" class="search-box" placeholder="Email address" autocomplete="email">
<input type="password" id="account-password" class="search-box" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter') signInToAccount();">
<p id="account-status" class="modal-status"></p>
<div class="buttons">
<button onclick="signInToAccount()">Sign In</button>
<button class="button-secondary" onclick="signUpForAccount()">Create Account</button>
</div>
<div class="buttons">
<button class="button-secondary" onclick="closeAccountModal()">Cancel</button>
</div>
</div>
</div>


<footer>

</footer>

// Navigation functions
function navigate(){
  var stop = PROJECT.tour[currentIndex];
  if (stop.latitude == null || stop.longitude == null) {
    alert('No coordinates available for ' + stop.name);
    return;
  }
  var url = 'https://www.google.com/maps/dir/?api=1&destination=' + stop.latitude + ',' + stop.longitude;

}

function previousStop(){
  if (currentIndex > 0) {
    goToStop(currentIndex - 1);
  }
}

function nextStop(){
  if (currentIndex < PROJECT.tour.length - 1) {
    goToStop(currentIndex + 1);
  }
}

  renderHome();
}

// Deep-linking - reads #stop-N from the URL so the back/forward
// buttons, bookmarks, and shared links land on the right stop
// instead of always dropping back to the homepage
function handleHashChange(){
  var hash = window.location.hash.replace("#", "");
  if(hash.indexOf("stop-") === 0){
    var idx = parseInt(hash.replace("stop-", ""), 10);
    if(!isNaN(idx) && idx >= 0 && idx < PROJECT.tour.length){
      currentIndex = idx;
      render();
      return;
    }
  }
  renderHome();
}

window.addEventListener("hashchange", handleHashChange);

// Keyboard navigation - left/right arrows move between stops while
// viewing a stop card; Escape returns to the itinerary homepage
document.addEventListener("keydown", function(event){
  if (currentView !== "stop") return;
  if (event.key === "ArrowRight") nextStop();
  else if (event.key === "ArrowLeft") previousStop();
  else if (event.key === "Escape") showHomeScreen();
});

// Swipe navigation for touch devices - swipe left/right between
// stops while viewing a stop card
var touchStartX = null;

document.addEventListener("touchstart", function(event){
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener("touchend", function(event){
  if (touchStartX === null || currentView !== "stop") return;
  var deltaX = event.changedTouches[0].screenX - touchStartX;
  var SWIPE_THRESHOLD = 50;
  if (deltaX > SWIPE_THRESHOLD) previousStop();
  else if (deltaX < -SWIPE_THRESHOLD) nextStop();
  touchStartX = null;
}, { passive: true });

function haversineMiles(lat1, lon1, lat2, lon2){
  if(lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
  const R = 3958.8; // Earth radius in miles
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function estimateDriveMinutes(miles){
  // Rough estimate for rural/coastal UK roads - not real routing, just a
  // straight-line-distance-based guide since generating real driving
  // directions needs a routing API and API key.
  const AVG_MPH = 28;
  return Math.round((miles / AVG_MPH) * 60);
}

function resolveImageSrc(image){
  // KMZ-imported trips reference a local file in ./images/. Trips
  // generated in-browser (New Trip) have no local file to save to, so
  // they store the Wikipedia thumbnail URL directly instead.
  if(!image) return "";
  if(image.indexOf("http") === 0) return image;
  return "./images/" + image;
}

var supabaseClient = null;

function isCloudConfigured(){
  return SUPABASE_URL && SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf("__") !== 0 && SUPABASE_ANON_KEY.indexOf("__") !== 0;
}

function getSupabaseClient(){
  if(!isCloudConfigured()) return null;
  if(!supabaseClient && typeof supabase !== "undefined"){
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return supabaseClient;
}

async function checkAuthSession(){
  const client = getSupabaseClient();
  if(!client) return;
  const { data } = await client.auth.getSession();
  currentUser = (data && data.session && data.session.user) || null;
}

  const email = document.getElementById("account-email").value.trim();
  const password = document.getElementById("account-password").value;
  if(!email || !password){
    setAccountStatus("Enter an email and password.");

  setAccountStatus("Creating account...");
  const { data, error } = await client.auth.signUp({ email, password });
  if(error){

    closeAccountModal();
    await loadMyTrips();

async function geocodePlace(placeName){
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(placeName);
  const response = await fetch(url);
  if(!response.ok) throw new Error("geocoding failed");
  const results = await response.json();
  if(!results.length) return null;
  return {
    lat: parseFloat(results[0].lat),
    lon: parseFloat(results[0].lon),
    displayName: results[0].display_name || placeName
  };
}

async function geosearchNearby(lat, lon, radiusKm, limit){
  const url = "https://en.wikipedia.org/w/api.php" +
    "?action=query&list=geosearch" +
    "&gscoord=" + lat + "|" + lon +
    "&gsradius=" + Math.min(Math.round(radiusKm * 1000), 10000) +
    "&gslimit=" + limit +
    "&format=json&origin=*";
  const response = await fetch(url);
  if(!response.ok) throw new Error("place search failed");
  const data = await response.json();
  return (data.query && data.query.geosearch) || [];
}

async function getWikiSummary(title){
  const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g, "_"));
  const response = await fetch(url);
  if(!response.ok) return null;
  return response.json();
}

async function generateNewTrip(){
  const placeName = document.getElementById("new-trip-input").value.trim();
  if(!placeName){
    setNewTripStatus("Type a place name first.");
    return;
  }

  document.getElementById("new-trip-input").disabled = true;
  document.getElementById("new-trip-generate-btn").disabled = true;

  const STOPS_PER_DAY = 6;
  const MAX_STOPS = 18;
  const RADIUS_KM = 8;

  try{
    setNewTripStatus("Looking up \"" + placeName + "\"...");
    const place = await geocodePlace(placeName);
    if(!place){
      setNewTripStatus("Couldn't find that place - check the spelling and try again.");
      document.getElementById("new-trip-input").disabled = false;
      document.getElementById("new-trip-generate-btn").disabled = false;
      return;
    }

    setNewTripStatus("Found " + place.displayName + " - searching nearby...");
    const candidates = await geosearchNearby(place.lat, place.lon, RADIUS_KM, MAX_STOPS * 2);

    if(!candidates.length){
      setNewTripStatus("No nearby points of interest found - try a different place.");
      document.getElementById("new-trip-input").disabled = false;
      document.getElementById("new-trip-generate-btn").disabled = false;
      return;
    }

    setNewTripStatus("Found " + candidates.length + " candidates - fetching details...");

    const detailed = [];
    for(const candidate of candidates){
      const summary = await getWikiSummary(candidate.title);
      if(!summary || summary.type === "disambiguation" || !summary.extract) continue;
      detailed.push({
        name: candidate.title,
        latitude: candidate.lat,
        longitude: candidate.lon,
        why_visit: summary.extract.slice(0, 400),
        image: (summary.thumbnail && summary.thumbnail.source) || "",
        distance: candidate.dist || 0
      });
      setNewTripStatus("Fetching details... (" + detailed.length + "/" + Math.min(candidates.length, MAX_STOPS) + ")");
      if(detailed.length >= MAX_STOPS) break;
    }

    if(!detailed.length){
      setNewTripStatus("Couldn't find enough detail on nearby places - try a different place.");
      document.getElementById("new-trip-input").disabled = false;
      document.getElementById("new-trip-generate-btn").disabled = false;
      return;
    }

    // Greedy nearest-neighbour ordering for a sensible route, same
    // approach as the notebook's Python version
    const ordered = [];
    const remaining = detailed.slice();
    let currentLat = place.lat, currentLon = place.lon;
    while(remaining.length){
      remaining.sort((a, b) =>
        haversineMiles(currentLat, currentLon, a.latitude, a.longitude) -
        haversineMiles(currentLat, currentLon, b.latitude, b.longitude)
      );
      const next = remaining.shift();
      ordered.push(next);
      currentLat = next.latitude;
      currentLon = next.longitude;
    }

    const tour = ordered.map((place, i) => ({
      id: String(i + 1).padStart(4, "0"),
      name: place.name,
      latitude: place.latitude,
      longitude: place.longitude,
      day: Math.floor(i / STOPS_PER_DAY) + 1,
      stop: (i % STOPS_PER_DAY) + 1,
      why_visit: place.why_visit,
      image: place.image,
      hero_image: place.image,
      category: "", visit_time: "", parking: "", toilets: "", cafe: "", dogs: "",
      website: "", highlights: [], difficulty: "", best_weather: "", accessibility: "",
      price: "", booking_required: false, family_friendly: true, opening_hours: "",
      postcode: "", nearest_town: "", tags: [], gallery: [], photo_spots: [],
      best_viewpoint: "", hidden_gems: [], campervan_tip: "", family_tip: "",
      experience_rating: 0
    }));

    const newProject = {
      project: {
        name: placeName.charAt(0).toUpperCase() + placeName.slice(1) + " Trip",
        days: Math.max.apply(null, tour.map(s => s.day)),
        stops: tour.length,
        campsites: 0
      },
      tour: tour,
      campsites: []
    };

    localStorage.setItem(CUSTOM_TRIP_KEY, JSON.stringify(newProject));
    PROJECT = newProject;
    currentIndex = 0;
    updatePageTitle();

    // If signed in with cloud sync configured, also save this trip to
    // the account so it follows across devices - otherwise it stays
    // local-only, same as before
    if(currentUser && isCloudConfigured()){
      await saveTripToCloud(newProject);
    }

    closeNewTripModal();
    renderHome();

  } catch(error){
    setNewTripStatus("Something went wrong (" + error.message + ") - check your connection and try again.");
    document.getElementById("new-trip-input").disabled = false;
    document.getElementById("new-trip-generate-btn").disabled = false;
  }
}

// WMO weather codes (used by Open-Meteo, a free no-API-key weather
// service) mapped to a short label and icon
const WEATHER_CODES = {
  0: ["Clear sky", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
  45: ["Fog", "🌫️"], 48: ["Fog", "🌫️"],
  51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌦️"],
  61: ["Light rain", "🌧️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
  71: ["Light snow", "🌨️"], 73: ["Snow", "🌨️"], 75: ["Heavy snow", "🌨️"],
  80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌦️"], 82: ["Heavy showers", "⛈️"],
  95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"]
};

async function loadWeather(stop, forStopIndex){
  const widget = document.getElementById("weather-widget");
  if(!widget) return;

  if(stop.latitude == null || stop.longitude == null){
    widget.innerHTML = `<strong>🌡️ Weather</strong>No coordinates available`;
    return;
  }

  try{
    const url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + stop.latitude +
      "&longitude=" + stop.longitude +
      "&current=temperature_2m,weather_code" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=1";

    const response = await fetch(url);
    if(!response.ok) throw new Error("weather request failed");
    const data = await response.json();

    // If the user has navigated to a different stop while this was
    // in flight, don't overwrite the newer card with stale data
    if(forStopIndex !== currentIndex) return;

    const code = data.current.weather_code;
    const info = WEATHER_CODES[code] || ["Weather", "🌡️"];
    const now = Math.round(data.current.temperature_2m);
    const max = Math.round(data.daily.temperature_2m_max[0]);
    const min = Math.round(data.daily.temperature_2m_min[0]);
    const rain = data.daily.precipitation_probability_max[0];

    widget.innerHTML = `
<strong>${info[1]} ${info[0]}</strong>
Now ${now}°C · Today ${min}°-${max}°C · Rain chance ${rain}%
`;

  } catch(error){
    if(forStopIndex !== currentIndex) return;
    widget.innerHTML = `<strong>🌡️ Weather</strong>Unavailable right now (no connection?)`;
  }
}

async function loadNearbyRestaurants(stop, forStopIndex){
  const widget = document.getElementById("restaurants-widget");
  if(!widget) return;

  if(stop.latitude == null || stop.longitude == null){
    widget.innerHTML = `<strong>🍽️ Nearby Eateries</strong>No coordinates available`;
    return;
  }

  const tripAdvisorUrl = "https://www.tripadvisor.com/Search?q=" +
    encodeURIComponent("restaurants near " + stop.name);

  try{
    // OpenStreetMap's free Overpass API - real crowd-sourced restaurant/
    // cafe/pub locations, no API key needed. It doesn't carry ratings
    // (OSM isn't a review site), so this is genuinely nearby places, not
    // a ranked "best of" list - the TripAdvisor link below is for that.
    const query = `[out:json][timeout:15];(node["amenity"~"restaurant|cafe|pub"](around:1000,${stop.latitude},${stop.longitude}););out body 10;`;
    const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

    const response = await fetch(url);
    if(!response.ok) throw new Error("restaurant search failed");
    const data = await response.json();

    if(forStopIndex !== currentIndex) return;

    const places = (data.elements || [])
      .filter(el => el.tags && el.tags.name)
      .map(el => {
        const distanceMiles = haversineMiles(stop.latitude, stop.longitude, el.lat, el.lon);
        return {
          name: el.tags.name,
          cuisine: el.tags.cuisine ? el.tags.cuisine.replace(/_/g, " ") : "",
          type: el.tags.amenity,
          distanceMiles: distanceMiles
        };
      })
      .sort((a, b) => a.distanceMiles - b.distanceMiles)
      .slice(0, 6);

    if(places.length === 0){
      widget.innerHTML = `
<strong>🍽️ Nearby Eateries</strong>
Nothing found within a mile via OpenStreetMap.
<a href="${tripAdvisorUrl}" target="_blank" rel="noopener" class="widget-link">Search TripAdvisor instead →</a>
`;
      return;
    }

    const listHtml = places.map(place => {
      const distanceLabel = place.distanceMiles < 0.1
        ? "under 0.1 mi"
        : place.distanceMiles.toFixed(1) + " mi";
      const detail = [place.cuisine, distanceLabel].filter(Boolean).join(" · ");
      return `<div class="eatery-row">${place.name}<span class="eatery-meta">${detail}</span></div>`;
    }).join("");

    widget.innerHTML = `
<strong>🍽️ Nearby Eateries</strong>
${listHtml}
<a href="${tripAdvisorUrl}" target="_blank" rel="noopener" class="widget-link">See ratings & reviews on TripAdvisor →</a>
`;

  } catch(error){
    if(forStopIndex !== currentIndex) return;
    widget.innerHTML = `
<strong>🍽️ Nearby Eateries</strong>
Unavailable right now (no connection?)
<a href="${tripAdvisorUrl}" target="_blank" rel="noopener" class="widget-link">Search TripAdvisor instead →</a>
`;
  }
}

function filterStops(){
  const query = document.getElementById("stop-search").value.trim().toLowerCase();
  document.querySelectorAll(".day-card").forEach(dayCard => {
    let anyVisible = false;
    dayCard.querySelectorAll(".stop-link").forEach(link => {
      const isMatch = link.textContent.toLowerCase().includes(query);
      link.style.display = isMatch ? "" : "none";
      if(isMatch) anyVisible = true;
    });
    dayCard.style.display = (query === "" || anyVisible) ? "" : "none";
  });
}

var homeMap = null;

function renderHome(){

currentView = "home";
scrollToTop();

document.getElementById("summary").innerHTML =
`${PROJECT.project.days} Day Tour • ${PROJECT.project.stops} Stops`;

try {

${(isCloudConfigured() && currentUser) ? `

`).join("")}

` : ""}

<input type="text" id="stop-search" class="search-box" placeholder="🔍 Search for a stop..." oninput="filterStops()">

<div id="map" class="map-container"></div>

<strong>📱 Share This Trip</strong>

function initQRCode(){

  if(typeof QRCode === "undefined") {
    const box = document.getElementById("homepage-qr");
    if(box) box.closest(".qr-card").style.display = "none";
    return; // QR library failed to load (e.g. offline, first visit)
  }

  const box = document.getElementById("homepage-qr");
  if(!box) return;

  box.innerHTML = "";

  // Link to the homepage (strip any #stop-N hash) so the QR code
  // always shares the trip overview, not wherever you currently are
  const shareUrl = window.location.origin + window.location.pathname;

  new QRCode(box, {
    text: shareUrl,
    width: 140,
    height: 140,
    colorDark: "#0E4D46",
    colorLight: "#FFFCF3",
    correctLevel: QRCode.CorrectLevel.H
  });

}

function initHomeMap(){

  if(typeof L === "undefined") return; // Leaflet failed to load (e.g. offline, first visit)

  const mapEl = document.getElementById("map");
  if(!mapEl) return;

  const validStops = PROJECT.tour.filter(s => s.latitude != null && s.longitude != null);
  if(validStops.length === 0) return;

  if(homeMap){
    homeMap.remove();
    homeMap = null;
  }

  homeMap = L.map("map");

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 18
  }).addTo(homeMap);

  const markers = [];

  validStops.forEach(stop => {
    const idx = PROJECT.tour.indexOf(stop);
    const marker = L.marker([stop.latitude, stop.longitude]).addTo(homeMap);
    marker.bindPopup(`<strong>Day ${stop.day} · ${stop.name}</strong><br><a href="#" onclick="goToStop(${idx});return false;">View stop</a>`);
    markers.push(marker);
  });

  const bounds = L.featureGroup(markers).getBounds();
  homeMap.fitBounds(bounds, { padding: [24, 24] });

}

function goToStop(index){
  currentIndex = index;
  if(window.location.hash !== "#stop-" + index){
    window.location.hash = "stop-" + index;
  }
  render();
}

function render(){

scrollToTop();

const stop = PROJECT.tour[currentIndex];

document.getElementById("summary").innerHTML =
`${PROJECT.project.days} Day Tour • ${PROJECT.project.stops} Stops`;

const progressPercent = Math.round(((currentIndex + 1) / PROJECT.tour.length) * 100);
const progressBar = `
<div class="progress-bar-track">
<div class="progress-bar-fill" style="width:${progressPercent}%"></div>
</div>
`;

// -------------------------------
// DISTANCE TO NEXT STOP
// -------------------------------

let nextStopLine = "";
const nextStop = PROJECT.tour[currentIndex + 1];
if(nextStop){
  const legMiles = haversineMiles(stop.latitude, stop.longitude, nextStop.latitude, nextStop.longitude);
  if(legMiles != null){
    const legMinutes = estimateDriveMinutes(legMiles);
    nextStopLine = `<div class="next-leg">🚗 ~${legMiles.toFixed(1)} mi (~${legMinutes} min) to ${nextStop.name}</div>`;
  }
}

let media = "";

// -------------------------------
// MEDIA EXPERIENCE
// -------------------------------

const heroImage = stop.hero_image || stop.image;

if(
heroImage ||
stop.gallery ||
stop.photo_spots ||
stop.hidden_gems ||
stop.campervan_tip ||
stop.family_tip ||
stop.experience_rating
){

media += `<div class="section-title">📸 Experience</div><div class="info-grid">`;

media += `
<div class="info-card">
<strong>🖼️ Hero Image</strong>

src="${resolveImageSrc(heroImage)}"
alt="${stop.name}"
style="width:100%; border-radius:16px; margin-top:15px;"
onerror="this.closest('.info-card').style.display='none';"
>

media += `

${stop.best_viewpoint}
</div>
`;
}

if(stop.photo_spots && stop.photo_spots.length){
media += `
<div class="info-card">
<strong>📷 Photo Spots</strong>
${Array.isArray(stop.photo_spots) ? stop.photo_spots.join("<br>") : stop.photo_spots}
</div>
`;
}

if(stop.hidden_gems && stop.hidden_gems.length){
media += `
<div class="info-card">
<strong>💎 Hidden Gems</strong>
${Array.isArray(stop.hidden_gems) ? stop.hidden_gems.join("<br>") : stop.hidden_gems}
</div>
`;
}

if(stop.campervan_tip){
media += `
<div class="info-card">
<strong>🚐 Campervan Tip</strong>
${stop.campervan_tip}
</div>
`;
}

if(stop.family_tip){
media += `
<div class="info-card">
<strong>👨‍👩‍👧 Family Tip</strong>
${stop.family_tip}
</div>
`;
}

if(stop.experience_rating){
media += `
<div class="info-card">
<strong>⭐ Experience Rating</strong>
${"⭐".repeat(stop.experience_rating)}
</div>
`;
}

media += `</div>`;
}

// -------------------------------
// QUICK FACTS (only if at least one is present)
// -------------------------------

let quickFacts = "";
if(stop.visit_time || stop.price || stop.difficulty){
quickFacts = `
<div class="quick-facts">
${stop.visit_time ? `<div class="fact">${stop.visit_time}</div>` : ""}
${stop.price ? `<div class="fact">${stop.price}</div>` : ""}
${stop.difficulty ? `<div class="fact">${stop.difficulty}</div>` : ""}
</div>
`;
}

// -------------------------------
// HIGHLIGHTS (only if there are any)
// -------------------------------

let highlightsBox = "";
if(stop.highlights && stop.highlights.length){
highlightsBox = `
<div class="highlights-box">
<h4>⭐ Highlights</h4>
<ul>${stop.highlights.map(x=>`<li>${x}</li>`).join("")}</ul>
</div>
`;
}

// -------------------------------
// VISIT (only cards with content; section hidden if none)
// -------------------------------

let visitCards = "";
if(stop.visit_time) visitCards += `<div class="info-card"><strong>Visit Time</strong>${stop.visit_time}</div>`;
if(stop.price) visitCards += `<div class="info-card"><strong>Price</strong>${stop.price}</div>`;

// -------------------------------
// FACILITIES (only cards with content; section hidden if none)
// -------------------------------

if(stop.difficulty) accessCards += `<div class="info-card"><strong>Difficulty</strong>${stop.difficulty}</div>`;

const accessSection = `<div class="section-title">Access</div><div class="info-grid">${accessCards}</div>`;

// -------------------------------
// TONIGHT'S CAMP (only on the last stop of a day, if a campsite
// for that day exists)
// -------------------------------

let campSection = "";
const isLastStopOfDay = (currentIndex === PROJECT.tour.length - 1) ||
  (PROJECT.tour[currentIndex + 1] && PROJECT.tour[currentIndex + 1].day !== stop.day);

if(isLastStopOfDay && PROJECT.campsites){
  const camp = PROJECT.campsites.find(c => c.day === stop.day);

    if(camp.open_season) campCards += `<div class="info-card"><strong>Open</strong>${camp.open_season}</div>`;
    if(camp.postcode) campCards += `<div class="info-card"><strong>Postcode</strong>${camp.postcode}</div>`;
    campSection = `
<div class="section-title">🏕 Tonight's Camp: ${camp.name}</div>

  }

// -------------------------------
// MAIN CARD
// -------------------------------

document.getElementById("app").innerHTML = `
<div class="card">

<div class="category ${(stop.category || "default").toLowerCase()}">

// Initial render on page load - respects a #stop-N deep link if
// present (e.g. from a bookmark or shared URL), otherwise shows

// existing signed-in session first (Supabase persists sessions in
// local storage itself) and load that account's trips before the
// first render, so "My Trips" is populated immediately rather than
// popping in a moment later.
(async function bootstrap(){
  if(isCloudConfigured()){

    if(currentUser) await loadMyTrips();

})();
